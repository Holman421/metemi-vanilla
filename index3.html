<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metemi Stable Radar v10</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* POZADÍ */
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .animated-gradient-bg {
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #312e81, #1e1b4b);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
        }

        /* 3D SCÉNA */
        .scene-perspective { perspective: 1000px; }
        .radar-plane {
            position: relative; width: 100%; height: 100%;
            transform-style: preserve-3d; will-change: transform;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); 
        }

        /* RADAR */
        @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .radar-sweep {
            background: conic-gradient(from 0deg, transparent 0deg, transparent 200deg, rgba(255, 255, 255, 0.02) 280deg, rgba(244, 63, 94, 0.5) 360deg);
            border-radius: 50%; filter: blur(8px);
        }

        /* ANIMACE */
        @keyframes emerge {
            0% { opacity: 0; transform: scale(0) translateY(50px); filter: blur(10px);}
            60% { transform: scale(1.1) translateY(-10px); filter: blur(0px);}
            100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0px);}
        }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-15px); } }

        /* KOTVA & HITBOX FIX */
        .bubble-anchor {
            position: absolute; z-index: 20;
            transform-style: preserve-3d; transform: translate(-50%, -50%); cursor: pointer;
        }
        .bubble-anchor::after { /* Neviditelný štít pro stabilitu myši */
            content: ''; position: absolute; top: -20%; left: -20%; width: 140%; height: 140%;
            border-radius: 50%; background: transparent; z-index: 1;
        }

        .anim-entry { width: 100%; height: 100%; opacity: 0; animation: emerge 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        .anim-float { width: 100%; height: 100%; animation: float 4s ease-in-out infinite; transform-origin: center center; }
        
        /* ZMRAZENÍ POHYBU PŘI HOVERU */
        .bubble-anchor:hover .anim-float, .bubble-anchor.is-spotlight .anim-float { animation-play-state: paused; }

        /* VIDEO KRUH */
        .video-circle {
            position: relative; width: 100%; height: 100%; border-radius: 9999px;
            border: 3px solid white;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            background: #1e1b4b; overflow: hidden; -webkit-mask-image: -webkit-radial-gradient(white, black);
            transform-origin: center center; z-index: 10;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
        }
        .media-content { width: 100%; height: 100%; object-fit: cover; display: block; will-change: transform; }

        /* INTERAKCE */
        .bubble-anchor:hover, .bubble-anchor.is-spotlight { z-index: 1000 !important; }
        .bubble-anchor:hover .video-circle, .bubble-anchor.is-spotlight .video-circle {
            transform: scale(2.8);
            box-shadow: 0 0 50px rgba(244, 63, 94, 0.8);
        }

        /* TEXTY */
        .label-badge {
            opacity: 0; position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%) translateZ(0);
            transition: all 0.3s ease; pointer-events: none; white-space: nowrap; z-index: 20;
            backface-visibility: hidden; -webkit-font-smoothing: subpixel-antialiased;
        }
        .bubble-anchor:hover .label-badge, .bubble-anchor.is-spotlight .label-badge {
            opacity: 1; bottom: -60px; transform: translateX(-50%) scale(1.2) translateZ(0);
        }

        .animate-spin-radar { animation: spin-slow 8s linear infinite; }
        .text-glow { text-shadow: 0 0 20px rgba(244, 63, 94, 0.5); }
    </style>
</head>
<body class="font-sans overflow-x-hidden animated-gradient-bg text-white">
    <section class="w-full min-h-screen flex flex-col lg:flex-row items-center justify-center px-4 lg:px-20 py-12 max-w-7xl mx-auto relative overflow-hidden">
        
        <div class="absolute top-0 left-0 w-full h-full pointer-events-none">
             <div class="absolute top-[-10%] left-[-10%] w-[600px] h-[600px] bg-purple-600 rounded-full mix-blend-screen filter blur-[120px] opacity-20 animate-pulse"></div>
             <div class="absolute bottom-[-10%] right-[-10%] w-[600px] h-[600px] bg-blue-600 rounded-full mix-blend-screen filter blur-[120px] opacity-20"></div>
        </div>

        <div class="w-full lg:w-5/12 text-center lg:text-left mb-16 lg:mb-0 z-20 relative">
            <div class="inline-block px-4 py-1.5 mb-6 border border-white/20 bg-white/10 backdrop-blur-md rounded-full text-red-400 font-medium text-sm shadow-lg">
                🚀 Startujeme v Krakově
            </div>
            <h1 class="text-5xl lg:text-7xl font-extrabold leading-tight tracking-tight drop-shadow-xl">
                Meet people <br>
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-red-400 to-orange-400 text-glow">
                    around you.
                </span>
                <br>
                Instantly.
            </h1>
            <p class="mt-6 text-xl text-gray-300 max-w-md mx-auto lg:mx-0 leading-relaxed">
                Don't swipe. Invite. <br>
                Objev lidi ve svém okolí a vyrazte na kafe, sport nebo procházku. Hned.
            </p>
            <div class="mt-10 flex gap-4 justify-center lg:justify-start">
                <a href="#" class="bg-white text-gray-900 px-8 py-4 rounded-2xl font-bold hover:bg-gray-100 transition-all shadow-[0_0_20px_rgba(255,255,255,0.3)] hover:shadow-[0_0_30px_rgba(255,255,255,0.5)] transform hover:-translate-y-1 flex items-center gap-3">
                    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor"><path d="M3,20.5V3.5C3,2.91 3.34,2.39 3.84,2.15L13.69,12L3.84,21.85C3.34,21.6 3,21.09 3,20.5M16.81,15.12L6.05,21.34L14.54,12.85L16.81,15.12M20.16,10.81C20.5,11.08 20.75,11.5 20.75,12C20.75,12.5 20.5,12.92 20.16,13.19L17.89,14.5L15.39,12L17.89,9.5L20.16,10.81M6.05,2.66L16.81,8.88L14.54,11.14L6.05,2.66Z" /></svg>
                    Google Play
                </a>
            </div>
        </div>

        <div class="w-full lg:w-7/12 flex justify-center items-center relative h-[600px] lg:h-[700px] scene-perspective">
            <div id="radar-plane" class="radar-plane relative w-[350px] h-[350px] lg:w-[600px] lg:h-[600px]">
                <div class="absolute inset-0 rounded-full" style="background-color: rgba(255, 255, 255, 0.07); filter: blur(15px);"></div>
                <div class="absolute inset-0 border rounded-full" style="border-color: rgba(255,255,255,0.12); border-width: 2px;"></div>
                <div class="absolute inset-[12.5%] border rounded-full" style="border-color: rgba(255,255,255,0.10); border-width: 2px;"></div>
                <div class="absolute inset-[25%] border rounded-full" style="border-color: rgba(255,255,255,0.08); border-width: 2px;"></div>
                <div class="absolute inset-[37.5%] border rounded-full" style="border-color: rgba(255,255,255,0.06); border-width: 2px;"></div>
                <div class="absolute inset-[50%] border rounded-full" style="border-color: rgba(255,255,255,0.04); border-width: 2px;"></div>
                <div class="absolute inset-0 w-full h-full animate-spin-radar radar-sweep z-0 opacity-80 mix-blend-plus-lighter"></div>

                <div id="bubbles-container" class="absolute inset-0 w-full h-full pointer-events-none"></div>
            </div>
        </div>
    </section>
    <script>
        // DATA
        const bubblesData = [
            { id: 1, label: "Coffee", src: "https://images.unsplash.com/photo-1497935586351-b67a49e012bf?w=300&fit=crop", top: "15%", left: "50%", size: 110 },
            { id: 2, label: "Run", src: "https://images.unsplash.com/photo-1461896836934-ffe607ba8211?w=300&fit=crop", top: "60%", left: "85%", size: 100 }, 
            { id: 3, label: "Dog Walk", src: "https://images.unsplash.com/photo-1601758228041-f3b2795255f1?w=300&fit=crop", top: "80%", left: "30%", size: 140 }, 
            { id: 4, label: "Date", src: "https://images.unsplash.com/photo-1566417713940-fe7c737a9ef2?w=300&fit=crop", top: "25%", left: "12%", size: 90 },
            { id: 5, label: "Shopping", src: "https://images.unsplash.com/photo-1483985988355-763728e1935b?w=300&fit=crop", top: "70%", left: "10%", size: 95 },
            { id: 6, label: "Gym", src: "https://images.unsplash.com/photo-1517836357463-d25dfeac3438?w=300&fit=crop", top: "20%", left: "80%", size: 105 },
            { id: 7, label: "Cinema", src: "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=300&fit=crop", top: "45%", left: "92%", size: 80 },
            { id: 8, label: "Food", src: "https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=300", top: "52%", left: "48%", size: 120 },
        ];

        const container = document.getElementById('bubbles-container');
        const radarPlane = document.getElementById('radar-plane');
        
        // GENEROVÁNÍ
        bubblesData.forEach((item, index) => {
            const anchor = document.createElement('div');
            anchor.className = 'bubble-anchor pointer-events-auto';
            anchor.style.top = item.top;
            anchor.style.left = item.left;
            anchor.style.width = item.size + 'px';
            anchor.style.height = item.size + 'px';
            
            const delay = index * 0.2; 
            
            // HTML Struktura s fixem animace
            anchor.innerHTML = `
                <div class="anim-entry w-full h-full" style="animation-delay: ${delay}s; opacity: 0; animation: emerge 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards ${delay}s;">
                    <div class="anim-float w-full h-full" style="animation-delay: ${delay}s;">
                        <div class="video-circle">
                            <img src="${item.src}" class="media-content" alt="${item.label}">
                            <div class="absolute inset-0 flex items-center justify-center bg-black/20 transition-opacity duration-300 opacity-100 hover:opacity-0">
                                <div class="w-0 h-0 border-t-[6px] border-t-transparent border-l-[10px] border-l-white border-b-[6px] border-b-transparent ml-1 opacity-80"></div>
                            </div>
                        </div>
                        <span class="label-badge px-4 py-1.5 bg-black/80 backdrop-blur-md text-sm font-bold rounded-full shadow-lg text-white border border-white/20">
                            ${item.label}
                        </span>
                    </div>
                </div>
            `;
            container.appendChild(anchor);
        });

        const anchors = document.querySelectorAll('.bubble-anchor');

        // TILT LOGIKA + RESET PŘI HOVERU
        document.addEventListener('mousemove', (e) => {
            const isHovering = e.target.closest('.bubble-anchor');
            if (isHovering) {
                radarPlane.style.transform = `rotateX(0deg) rotateY(0deg)`;
                return;
            }
            const x = (window.innerWidth / 2 - e.clientX) / 30; 
            const y = (window.innerHeight / 2 - e.clientY) / 30;
            radarPlane.style.transform = `rotateX(${y}deg) rotateY(${-x}deg)`;
        });

        // SPOTLIGHT
        let spotlightTimeout;
        function randomSpotlight() {
            anchors.forEach(a => a.classList.remove('is-spotlight'));
            const isHovering = Array.from(anchors).some(a => a.matches(':hover'));
            if (!isHovering) {
                const randomIndex = Math.floor(Math.random() * anchors.length);
                anchors[randomIndex].classList.add('is-spotlight');
            }
            spotlightTimeout = setTimeout(randomSpotlight, 3500);
        }

        anchors.forEach(a => {
            a.addEventListener('mouseenter', () => {
                anchors.forEach(el => el.classList.remove('is-spotlight'));
                clearTimeout(spotlightTimeout);
            });
            a.addEventListener('mouseleave', () => {
                spotlightTimeout = setTimeout(randomSpotlight, 2000);
            });
        });
        setTimeout(randomSpotlight, 1500);
    </script>
</body>
</html>
